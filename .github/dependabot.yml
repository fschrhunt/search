version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 1
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(infra)"
