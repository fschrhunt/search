name: CI

# What a pull request must pass. Local checks run the same commands through `./x`,
# so no environment has a private definition of "green".
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - name: Linux (ARM64)
            os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - name: macOS (Apple Silicon)
            os: macos-latest
            triple: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-15-intel
            triple: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            triple: x86_64-pc-windows-msvc
          - name: Windows (ARM64)
            os: windows-11-arm
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.98.0-${{ matrix.triple }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: 1.98.0-${{ matrix.triple }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ startsWith(matrix.triple, 'aarch64') && 'arm64' || 'x64' }}
      - name: Verify native Rust host
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')" = "$TRIPLE"
      - name: Select a user-owned Windows test temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = Join-Path $env:LOCALAPPDATA 'Temp'
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          "SEARCH_TEST_TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: ./x check
        env:
          # Avoid macOS's /var -> /private/var alias in security-sensitive fixtures.
          # Windows's shared runner temp need not have trustworthy ACLs/ownership.
          TMPDIR: ${{ env.SEARCH_TEST_TEMP || runner.temp }}
          TMP: ${{ env.SEARCH_TEST_TEMP || runner.temp }}
          TEMP: ${{ env.SEARCH_TEST_TEMP || runner.temp }}
      - name: Build the native release profile
        run: ./x build --release --target "$TRIPLE"
        env:
          TRIPLE: ${{ matrix.triple }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          RUSTFLAGS: ${{ contains(matrix.triple, 'windows') && '-C target-feature=+crt-static' || '' }}
      - name: Verify the Windows release needs no C runtime redistributable
        if: runner.os == 'Windows'
        env:
          TRIPLE: ${{ matrix.triple }}
        run: python scripts/check-windows-imports.py "target/$TRIPLE/release/search.exe"
      - name: Check Windows installer syntax and behavior
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SEARCH_BUILD_VERSION: v0.0.0
          SEARCH_BUILD_CHANNEL: release
        run: |
          cargo build --locked --bin search
          if ($LASTEXITCODE -ne 0) { throw 'Installer fixture build failed' }
          ./scripts/test-install.ps1 -Binary target/debug/search.exe -Version v0.0.0
      - name: Check the installer with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-install.ps1 -Binary target/debug/search.exe -Version v0.0.0
